name: Maintenance
#
# Requires 'BOT_TOKEN' as a Dependabot secret: Dependabot runs only read Dependabot secrets,
# and a merge done with GITHUB_TOKEN starts no workflow on main.
#

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependabot_automerger:
    name: Dependabot Automerger
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Update branch and enable auto-merge
        run: |
          if gh pr view "${PR_URL}" --json mergeStateStatus | grep -q "BEHIND"; then
            echo "Branch is behind base branch, updating..."
            gh pr update-branch "${PR_URL}"
            sleep 5
          fi
          gh pr merge --auto --squash "${PR_URL}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
