name: Notifier

on:
  workflow_run:
    workflows:
      - Release
      - Security
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  notify:
    name: Notify failures
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Harden the runner
        uses: ./.github/actions/allow-endpoints
      - name: Send Pushover notification on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! "${TRIGGERING_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid workflow_run payload - head_sha must be a 40 character hexadecimal string" >&2
            exit 1
          fi
          runs=$(gh run list --commit "${TRIGGERING_SHA}" --json name,url,status,conclusion --jq '[.[] | select(.name != "Notifier")]')
          if [[ $(jq '[.[] | select(.status != "completed")] | length' <<< "${runs}") -ne 0 ]]; then
            echo "Some workflows are still running."
            exit 0
          fi
          failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "cancelled") | "- \(.name) (\(.url))"' <<< "${runs}")
          if [[ -z "${failed}" ]]; then
            echo "No failed workflows."
            exit 0
          fi
          message="The following workflows have failed:"$'\n'"${failed}"
          disabled=$(gh workflow list --all --json name,state --jq '.[] | select(.state != "active") | "- \(.name)"')
          if [[ -n "${disabled}" ]]; then
            message+=$'\n\n'"The following workflows are disabled:"$'\n'"${disabled}"
          fi
          curl -s \
            --form-string "token=${PUSHOVER_API_TOKEN}" \
            --form-string "user=${PUSHOVER_USER_KEY}" \
            --form-string "message=${message}" \
            --form-string "title=${GITHUB_REPOSITORY} GHA Failures (${TRIGGERING_SHA:0:7})" \
            --form-string "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions" \
            https://api.pushover.net/1/messages.json
